<!DOCTYPE html>
<html>
<head>
  <?!= include_('Common'); ?>
  <style>
    .wrap { max-width: 400px; }
    .card { padding: 40px 28px; text-align: center; }

    .icon-circle {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
    }
    .icon-circle svg { width: 28px; height: 28px; }
    .icon-circle.ok { background: #eef0f5; color: var(--accent); }
    .icon-circle.warn { background: var(--warning-bg); color: var(--warning-text); }
    .icon-circle.error { background: var(--error-bg); color: var(--error-text); }

    h1 { font-size: 17px; font-weight: 700; margin: 0 0 6px; word-break: break-word; }
    .hint { margin: 0 0 24px; }

    button.download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button.download-btn:hover:not([aria-disabled="true"]) { background: var(--accent-dark); }
    button.download-btn svg { width: 16px; height: 16px; }

    #downloadError { margin-top: 14px; text-align: left; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <? if (status === 'ok') { ?>
        <div class="icon-circle ok">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3H7C5.89543 3 5 3.89543 5 5V19C5 20.1046 5.89543 21 7 21H17C18.1046 21 19 20.1046 19 19V8L14 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 3V8H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1><?= fileName ?></h1>
        <p class="hint">有効期限: <?= expiresAt ?> まで</p>
        <button type="button" class="download-btn" id="downloadBtn" data-token="<?= token ?>">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4V16M12 16L7 11M12 16L17 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 20H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="downloadBtnLabel">ダウンロード</span>
        </button>
        <p class="msg-box error" id="downloadError" style="display:none;"></p>

      <? } else if (status === 'expired') { ?>
        <div class="icon-circle warn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M12 7V12L15.5 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>リンクの有効期限が切れています</h1>
        <p class="hint">このファイルは有効期限を過ぎたため、既に削除されているか、まもなく削除されます。</p>

      <? } else if (status === 'error') { ?>
        <div class="icon-circle warn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8V13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 16.5H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>一時的な問題が発生しました</h1>
        <p class="hint">サーバー側で問題が発生した可能性があります。しばらくしてから、ページを再読み込みしてもう一度お試しください。<br>解消しない場合は、リンクの発行元にご確認ください。</p>

      <? } else { ?>
        <div class="icon-circle error">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 9V13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 17H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M10.29 3.86L1.82 18A2 2 0 0 0 3.55 21H20.45A2 2 0 0 0 22.18 18L13.71 3.86A2 2 0 0 0 10.29 3.86Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>リンクが無効です</h1>
        <p class="hint">URLが正しいか確認してください。</p>
      <? } ?>
    </div>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('downloadBtn');
      if (!btn) { return; } // status !== 'ok' のときはボタン自体が存在しない

      var label = document.getElementById('downloadBtnLabel');
      var errorBox = document.getElementById('downloadError');
      var defaultLabel = label.textContent;
      var token = btn.getAttribute('data-token');
      var busy = false;

      function setBusy(isBusy, text) {
        busy = isBusy;
        btn.setAttribute('aria-disabled', isBusy ? 'true' : 'false');
        btn.style.opacity = isBusy ? '0.7' : '';
        label.textContent = text;
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      // base64 → Blob化して即ダウンロード発火。元のMIMEタイプに関わらず常に
      // application/octet-stream として Blob 化する(HTML/SVG/JS等のアクティブ
      // コンテンツがブラウザ上で実行・レンダリングされるのを防ぐため)。
      function triggerDownload(base64Data, fileName) {
        var byteChars = atob(base64Data);
        var byteNumbers = new Array(byteChars.length);
        for (var i = 0; i < byteChars.length; i++) {
          byteNumbers[i] = byteChars.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], { type: 'application/octet-stream' });
        var url = URL.createObjectURL(blob);

        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      }

      btn.addEventListener('click', function () {
        if (busy) { return; }

        errorBox.style.display = 'none';
        setBusy(true, '読み込み中…');

        google.script.run
          .withSuccessHandler(function (res) {
            setBusy(false, defaultLabel);
            if (!res || !res.success) {
              var status = res && res.status;
              if (status === 'expired') {
                showError('このリンクは有効期限が切れています。');
              } else if (status === 'notfound') {
                showError('ファイルが見つかりませんでした。リンクが正しいかご確認ください。');
              } else {
                showError('ダウンロードに失敗しました。しばらくしてから再度お試しください。');
              }
              return;
            }
            try {
              triggerDownload(res.base64Data, res.fileName);
            } catch (err) {
              showError('ダウンロードに失敗しました。しばらくしてから再度お試しください。');
            }
          })
          .withFailureHandler(function () {
            setBusy(false, defaultLabel);
            showError('通信エラーが発生しました。しばらくしてから再度お試しください。');
          })
          .getFileForDownload(token);
      });
    })();
  </script>
</body>
</html>
